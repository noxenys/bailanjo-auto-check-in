name: Bailanjo Auto Check-in

on:
  schedule:
    - cron: "0 1 * * *"  # 每天 09:00 北京时间（GitHub 使用 UTC，需要 +8）
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Run check-in
        env:
          BAILANJO_ACCOUNT: ${{ secrets.BAILANJO_ACCOUNT }}
          BAILANJO_PASSWORD: ${{ secrets.BAILANJO_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          BARK_URL: ${{ secrets.BARK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          DINGTALK_WEBHOOK_URL: ${{ secrets.DINGTALK_WEBHOOK_URL }}
          WECHAT_WORK_WEBHOOK_URL: ${{ secrets.WECHAT_WORK_WEBHOOK_URL }}
        run: |
          python bailanjo_checkin.py --headless

      - name: Upload Error Screenshot
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: error-screenshot
          path: error_screenshot.png
          retention-days: 3